[project]
name = "supervise"
version = "1.0.0"
description = "Checkpointed plan, implement, verify, and independent review workflow for Claude Code, with phase rules enforced by a small CLI."
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mrramdn" }]
requires-python = ">=3.11"
# The core CLI is stdlib-only; it has no runtime dependencies on purpose.
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.uv]
# The plugin runs from source through bin/supervisectl; nothing is built or installed.
package = false

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts"]
extend-include = ["bin/supervisectl"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "S"]
ignore = ["PTH123"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"scripts/**" = ["S603", "S607"]
"src/**" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
